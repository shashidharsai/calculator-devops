server {
    listen 80;
    server_name _;

    # Docker's built-in DNS. Re-resolving the name every few seconds means
    # nginx keeps working after the calculator containers are recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Lightweight endpoint for nginx's own health check
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $backend "http://calculator:8080";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
    }
}
