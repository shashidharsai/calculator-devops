name: calculator

services:
  calculator:
    build: .
    image: ${DOCKERHUB_USER:-local}/calculator-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: "8080"
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    expose:
      - "8080"
    networks:
      - calc-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 2

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calc-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  calc-net:
    driver: bridge
